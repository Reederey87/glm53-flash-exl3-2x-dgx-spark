[project]
name = "glm53-fp4-local-2x-dgx-spark"
version = "2.0.0"
description = "Reproducible GLM-5.3-Flash-FP4-Local serving kit for a 2x NVIDIA DGX Spark (GB10) cluster"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

# The kit deploys with Docker, the pinned upstream launcher, and stdlib-only
# Python helpers. The serving image provides vLLM, torch, and the B12X kernels,
# so they are deliberately NOT dependencies here. Tests only need pytest and
# PyYAML (for the recipe).
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0",
  "PyYAML>=6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
