# TP=2 serve definition. One file, role selected by NODE_RANK/HEADLESS from
# render-env.sh. Both nodes run the identical compose.
#
# TRAP: never put a '#' comment inside the `command:` scalar below. It is a
# folded shell string, so a '#' comments out EVERY argument after it.
services:
  vllm-glm53:
    image: ${GLM53_IMAGE}
    pull_policy: never
    entrypoint: []
    container_name: vllm-glm53
    network_mode: host
    ipc: host
    shm_size: "64gb"
    ulimits: { memlock: -1, stack: 67108864 }
    gpus: all
    devices: [ "/dev/infiniband:/dev/infiniband" ]
    volumes:
      - ${HF_CACHE}:/cache/huggingface
    environment:
      HF_HOME: /cache/huggingface
      HF_HUB_OFFLINE: "1"
      VLLM_CACHE_ROOT: /cache/huggingface/vllm-cache
      TRITON_CACHE_DIR: /cache/huggingface/triton-cache
      FLASHINFER_WORKSPACE_BASE: /cache/huggingface/flashinfer
      FLASHINFER_CUDA_ARCH_LIST: "12.1a"
      FLASHINFER_DISABLE_VERSION_CHECK: "1"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      VLLM_ENGINE_READY_TIMEOUT_S: "3600"
      NCCL_NET: IB
      NCCL_IB_DISABLE: "0"
      NCCL_IB_HCA: "${NCCL_IB_HCA}"
      NCCL_SOCKET_IFNAME: "${QSFP_IF}"
      GLOO_SOCKET_IFNAME: "${QSFP_IF}"
      NCCL_IB_ADDR_FAMILY: AF_INET
      NCCL_IB_ROCE_VERSION_NUM: "2"
      NCCL_CUMEM_ENABLE: "0"
      NCCL_NVLS_ENABLE: "0"
      VLLM_HOST_IP: "${VLLM_HOST_IP}"
      NODE_RANK: "${NODE_RANK}"
      HEADLESS: "${HEADLESS}"
    command:
      - bash
      - -lc
      - >
        MEMTOTAL_KB="$$(awk '/^MemTotal:/{print $$2}' /proc/meminfo)";
        NEEDED_KB=$$(awk -v t="$$MEMTOTAL_KB" -v u="${GPU_MEMORY_UTILIZATION}" 'BEGIN{printf "%d", t*u}');
        NEEDED_KB=$$((NEEDED_KB + ${MEM_MARGIN_GIB} * 1024 * 1024));
        echo "== waiting for MemAvailable >= $$((NEEDED_KB/1024/1024)) GiB";
        for i in $$(seq 1 120); do
          A="$$(awk '/^MemAvailable:/{print $$2}' /proc/meminfo)";
          [ "$$A" -ge "$$NEEDED_KB" ] && { echo "== memory cleared: $$((A/1024/1024)) GiB"; break; };
          sleep 5;
        done;
        exec vllm serve ${GLM53_MODEL}
        --served-model-name ${SERVED_MODEL_NAME}
        --host ${VLLM_HOST} --port ${API_PORT}
        --trust-remote-code
        --reasoning-parser glm45 --tool-call-parser glm47 --enable-auto-tool-choice
        --no-enable-flashinfer-autotune
        --tensor-parallel-size 2 --pipeline-parallel-size 1
        --max-model-len ${MAX_MODEL_LEN}
        --max-num-seqs ${MAX_NUM_SEQS}
        --max-num-batched-tokens ${MAX_NUM_BATCHED_TOKENS}
        --gpu-memory-utilization ${GPU_MEMORY_UTILIZATION}
        --kv-cache-dtype ${KV_CACHE_DTYPE}
        --block-size ${BLOCK_SIZE}
        --attention-backend ${ATTENTION_BACKEND}
        --moe-backend ${MOE_BACKEND}
        --enable-prefix-caching --enable-chunked-prefill
        --no-disable-hybrid-kv-cache-manager
        --no-async-scheduling
        ${ENFORCE_EAGER:+--enforce-eager}
        --default-chat-template-kwargs '{"reasoning_effort":"${REASONING_EFFORT}"}'
        --distributed-executor-backend mp
        --nnodes 2 --node-rank ${NODE_RANK}
        --master-addr ${MASTER_ADDR} --master-port ${MASTER_PORT}
        ${HEADLESS:+--headless}
