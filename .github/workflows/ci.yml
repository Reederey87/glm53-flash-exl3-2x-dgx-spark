name: ci
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # SC1091: sourced .env / notify.env are gitignored by design.
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck -e SC1091

      - name: bash syntax
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n

      - name: python syntax
        run: |
          python3 -m compileall -q local overlay tests
          echo "python OK"

      - name: python tests
        run: |
          python3 -m pip install --quiet -r requirements-dev.txt
          python3 -m pytest tests/ -q

      - name: no secrets or private config committed
        run: |
          # .env is the only file with site config (and possibly an HF token).
          test ! -f .env || { echo ".env is committed!"; exit 1; }
          ! grep -rEn "BEGIN [A-Z ]*PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|hf_[A-Za-z0-9]{30,}" . --exclude-dir=.git
          echo "secret scan OK"
