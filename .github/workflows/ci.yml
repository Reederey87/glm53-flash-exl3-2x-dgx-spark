name: ci
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: test dependencies
        run: uv sync --frozen

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # SC1091: sourced .env / notify.env are gitignored by design.
          git ls-files -z '*.sh' | xargs -0 shellcheck -e SC1091

      - name: bash syntax
        run: git ls-files -z '*.sh' | xargs -0 -n1 bash -n

      - name: python syntax
        run: |
          uv run python -m compileall -q local overlay tests scripts
          echo "python OK"

      - name: python tests
        run: |
          uv run pytest tests/ -q

      - name: no secrets or private config committed
        run: |
          # .env is the only file with site config (and possibly an HF token).
          test ! -f .env || { echo ".env is committed!"; exit 1; }
          scan_status=0
          git grep -q -E "BEGIN [A-Z ]*PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|hf_[A-Za-z0-9]{30,}" || scan_status=$?
          if [ "$scan_status" -ne 1 ]; then
            echo "secret scan matched a pattern or could not run"
            exit 1
          fi
          echo "secret scan OK"
